name: Sincronizar Wiki

on:
  push:
    branches: [ master ]  # Dispara apenas quando houver push na branch master
    paths:
      - 'wiki/**'   # Dispara apenas quando algo mudar na pasta wiki/

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Permissão para escrever no repositório da wiki
    steps:
      # 1. Baixa o código do seu repositório principal (meufenil)
      - name: Checkout do repositório principal
        uses: actions/checkout@v4

      # 2. Baixa o repositório da wiki (meufenil.wiki.git)
      - name: Checkout da wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-temp
          token: ${{ secrets.GITHUB_TOKEN }}

      # Sincronização com limpeza
      - name: Sincronizar arquivos (espelho exato)
        run: |
          # Remove todos os .md existentes na wiki
          rm -f wiki-temp/*.md
          # Copia os novos .md da pasta wiki/
          cp wiki/*.md wiki-temp/ || true

      - name: Commit e Push para a wiki
        run: |
          cd wiki-temp
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada."
          else
            git commit -m "Sincronização automática da wiki - $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi